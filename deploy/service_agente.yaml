# Cloud Run para la API del agente (Parte 2). Mismo esquema de marcadores que service.yaml.
# No se despliega en esta prueba (propuesta); ver docs/operacion_agente.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agente-cobranza-__ENV__
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing   # solo el webhook de WhatsApp (por LB) y servicios internos
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "__MIN_INSTANCES__"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"                  # las llamadas al LLM son largas; CPU siempre asignada
    spec:
      containerConcurrency: 20                                      # cada conversación mantiene 2 a 4 llamadas al LLM en vuelo
      timeoutSeconds: 120
      serviceAccountName: agente-cobranza-sa@__PROJECT_ID__.iam.gserviceaccount.com   # roles: aiplatform.user, run.invoker (API del modelo), secretmanager.secretAccessor, cloudsql.client
      containers:
        - image: __IMAGE__
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: GCP_PROJECT_ID
              value: __PROJECT_ID__
            - name: LLM_REGION
              value: global
            - name: LLM_MODELO
              value: gemini-2.5-flash
            - name: LLM_MODELO_GUARDRAIL
              value: gemini-2.5-flash-lite
            - name: MODELO_API_URL
              value: __MODELO_API_URL__                             # API de la Parte 1 del mismo ambiente
            - name: MODELO_MODO
              value: api
            - name: SANDBOX_MODO
              value: "0"                                            # sin endpoints de sandbox en producción
            - name: AGENTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agente-api-key
                  key: latest
            - name: MODELO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: propension-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
