# Cloud Build del front del sandbox. A mano:
#   gcloud builds submit --config deploy/cloudbuild_front.yaml --substitutions=_ENV=demo,_SHORT_SHA=$(git rev-parse --short HEAD)
substitutions:
  _ENV: demo
  _REGION: us-central1
  _REPO: propension
  _SERVICE: front-cobranza
  _AGENTE_API_URL: https://agente-cobranza-demo-amdvve4e3q-uc.a.run.app
  _MIN_INSTANCES: "1"
  _SHORT_SHA: manual

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.front", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}"]

  - id: render
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        sed -e "s|__ENV__|${_ENV}|g" -e "s|__IMAGE__|${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}|g" -e "s|__PROJECT_ID__|${PROJECT_ID}|g" -e "s|__AGENTE_API_URL__|${_AGENTE_API_URL}|g" -e "s|__MIN_INSTANCES__|${_MIN_INSTANCES}|g" deploy/service_front.yaml > /workspace/service.rendered.yaml

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args: ["run", "services", "replace", "/workspace/service.rendered.yaml", "--region", "${_REGION}"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
