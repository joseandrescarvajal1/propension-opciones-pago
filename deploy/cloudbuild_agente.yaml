# Cloud Build de la API del agente (Parte 2). A mano:
#   gcloud builds submit --config deploy/cloudbuild_agente.yaml --substitutions=_ENV=demo,_SHORT_SHA=$(git rev-parse --short HEAD)
substitutions:
  _ENV: demo
  _REGION: us-central1
  _REPO: propension
  _SERVICE: agente-cobranza
  _MODELO_API_URL: https://propension-api-prod-amdvve4e3q-uc.a.run.app
  _MODELO_BUCKET_SUFIJO: "-modelos/modelos/v4"   # el bucket se arma con $PROJECT_ID en el paso de render
  _MIN_INSTANCES: "1"
  _SANDBOX_MODO: "1"
  _SHORT_SHA: manual

steps:
  - id: verificar-sandbox
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        test -f agente/sandbox/sandbox_base.db || { echo "Falta agente/sandbox/sandbox_base.db (no se versiona: es dato). Generarlo con: python agente/sandbox/crear_sandbox.py --base"; exit 1; }

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.agente", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}"]

  - id: render
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        sed -e "s|__ENV__|${_ENV}|g" -e "s|__IMAGE__|${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}|g" -e "s|__PROJECT_ID__|${PROJECT_ID}|g" -e "s|__MODELO_API_URL__|${_MODELO_API_URL}|g" -e "s|__MODELO_RUTA__|gs://${PROJECT_ID}${_MODELO_BUCKET_SUFIJO}|g" -e "s|__MIN_INSTANCES__|${_MIN_INSTANCES}|g" -e "s|__SANDBOX_MODO__|${_SANDBOX_MODO}|g" deploy/service_agente.yaml > /workspace/service.rendered.yaml

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args: ["run", "services", "replace", "/workspace/service.rendered.yaml", "--region", "${_REGION}"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
